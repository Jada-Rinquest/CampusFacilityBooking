<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signing out | Campus Facility Booking</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<!--
    The sign-in form lives in index.html.

    Every page links to login.html from the "Logout" button,
    so this page clears the session and sends the user back
    to the sign-in screen.
-->

<noscript>
    <p>
        Please <a href="index.html">click here to sign in</a>.
    </p>
</noscript>

<script>

    function clearLocalSession() {
        try {
            ["loggedInUser", "loginId", "registrarId", "username"].forEach(function (key) {
                sessionStorage.removeItem(key);
                localStorage.removeItem(key);
            });
        } catch (error) {
            console.error("Could not clear the session:", error);
        }
    }

    clearLocalSession();

    // End the server-side session too, so the session cookie
    // can no longer be used. Go to sign-in whatever happens.
    fetch("/auth/logout", { method: "POST", credentials: "same-origin" })
        .catch(function () { /* server unreachable - nothing to end */ })
        .finally(function () {
            window.location.replace("index.html");
        });

</script>

</body>

</html>
