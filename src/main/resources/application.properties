spring.application.name=CampusFacilityBooking

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/CampusFacilityBookingDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load sample data from data.sql after Hibernate has created the tables.
# continue-on-error keeps the app starting even if a row can't be inserted.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

server.port=8080

# Send error messages (e.g. "Use your CPUT email") back to the frontend
spring.web.error.include-message=always