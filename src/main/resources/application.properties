spring.application.name=CampusFacilityBooking

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/CampusFacilityBookingDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load sample data from data.sql after Hibernate has created the tables.
# continue-on-error keeps the app starting even if a row can't be inserted.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

server.port=8080

# ---- Session cookie (Spring Security keeps the signed-in user in the session) ----
# HttpOnly: JavaScript cannot read the cookie.
# SameSite=Strict: browsers don't send it on requests that start on
# other sites, which blocks cross-site request forgery (CSRF).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
# Keep the session id out of URLs
server.servlet.session.tracking-modes=cookie

# Send error messages (e.g. "Use your CPUT email") back to the frontend
spring.web.error.include-message=always